<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Myanmar OCR - Text Extractor</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Myanmar OCR</h1>
            <p class="subtitle">Image / PDF မှ မြန်မာစာ Text ထုတ်ယူခြင်း</p>
        </header>

        <main>
            <!-- Upload Section -->
            <div class="upload-section">
                <div id="dropZone" class="drop-zone">
                    <div class="drop-zone-content">
                        <svg class="upload-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
                            <polyline points="17 8 12 3 7 8"/>
                            <line x1="12" y1="3" x2="12" y2="15"/>
                        </svg>
                        <p class="drop-text">ဖိုင်ကို ဤနေရာတွင် ဆွဲချပါ</p>
                        <p class="drop-subtext">သို့မဟုတ်</p>
                        <button type="button" class="btn btn-browse" id="browseBtn">ဖိုင်ရွေးချယ်ရန်</button>
                        <p class="file-types">PNG, JPG, JPEG, BMP, TIFF, WebP, PDF</p>
                    </div>
                    <input type="file" id="fileInput" accept=".png,.jpg,.jpeg,.bmp,.tiff,.tif,.webp,.pdf" hidden>
                </div>

                <!-- File Preview -->
                <div id="filePreview" class="file-preview hidden">
                    <div class="preview-header">
                        <span id="fileName" class="file-name"></span>
                        <span id="fileSize" class="file-size"></span>
                        <button type="button" class="btn-remove" id="removeFile" title="Remove file">&times;</button>
                    </div>
                    <div id="imagePreview" class="image-preview hidden">
                        <img id="previewImage" src="" alt="Preview">
                    </div>
                </div>

                <!-- Language Selection -->
                <div class="options-row">
                    <div class="option-group">
                        <label for="langSelect">OCR Language</label>
                        <select id="langSelect">
                            <option value="mya" selected>မြန်မာ (Myanmar)</option>
                            <option value="eng">English</option>
                            <option value="mya+eng">မြန်မာ + English</option>
                        </select>
                    </div>
                    <button type="button" class="btn btn-primary" id="processBtn" disabled>
                        <span class="btn-text">OCR စတင်ရန်</span>
                        <span class="btn-loading hidden">
                            <span class="spinner"></span>
                            လုပ်ဆောင်နေသည်...
                        </span>
                    </button>
                </div>
            </div>

            <!-- Progress Section -->
            <div id="progressSection" class="progress-section hidden">
                <div class="progress-bar">
                    <div class="progress-fill" id="progressFill"></div>
                </div>
                <p class="progress-text" id="progressText">Processing...</p>
            </div>

            <!-- Results Section -->
            <div id="resultsSection" class="results-section hidden">
                <div class="results-header">
                    <h2>ရလဒ်များ</h2>
                    <div class="results-actions">
                        <button type="button" class="btn btn-secondary" id="downloadAllBtn">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="16" height="16">
                                <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
                                <polyline points="7 10 12 15 17 10"/>
                                <line x1="12" y1="15" x2="12" y2="3"/>
                            </svg>
                            အားလုံး Download
                        </button>
                        <button type="button" class="btn btn-outline" id="copyAllBtn">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="16" height="16">
                                <rect x="9" y="9" width="13" height="13" rx="2" ry="2"/>
                                <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>
                            </svg>
                            Copy All
                        </button>
                    </div>
                </div>

                <!-- PDF Page Tabs -->
                <div id="pageTabs" class="page-tabs hidden"></div>

                <!-- Text Output -->
                <div class="text-output-wrapper">
                    <textarea id="textOutput" class="text-output" readonly placeholder="Extracted text will appear here..."></textarea>
                </div>

                <!-- Page Results (for PDF) -->
                <div id="pageResults" class="page-results hidden"></div>
            </div>

            <!-- Error Section -->
            <div id="errorSection" class="error-section hidden">
                <div class="error-content">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="24" height="24">
                        <circle cx="12" cy="12" r="10"/>
                        <line x1="15" y1="9" x2="9" y2="15"/>
                        <line x1="9" y1="9" x2="15" y2="15"/>
                    </svg>
                    <p id="errorMessage"></p>
                    <button type="button" class="btn btn-secondary" id="retryBtn">ပြန်လည်ကြိုးစားရန်</button>
                </div>
            </div>
        </main>

        <footer>
            <p>Myanmar OCR Web Application &mdash; Powered by Tesseract OCR</p>
        </footer>
    </div>

    <script src="/static/js/app.js"></script>
</body>
</html>
